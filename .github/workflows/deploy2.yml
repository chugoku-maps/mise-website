name: Deploy to Sakura server

on:
  workflow_dispatch:
    inputs:
      pages_verified:
        description: GitHub Pagesの表示を目視確認済み
        required: true
        type: boolean
      commit_sha:
        description: 目視確認したGitHub PagesデプロイのコミットSHA
        required: true
        type: string

concurrency:
  group: sakura-production
  cancel-in-progress: false

jobs:
  build:
    name: Deploy after Pages verification
    if: ${{ inputs.pages_verified }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: pnpm build

      - name: Deploy to Sakura server via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          protocol: ftps
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/
          server-dir: ${{ secrets.SERVER_DIR }}
