name: Deploy to Sakura server

on:
  workflow_dispatch:
    inputs:
      pages_verified:
        description: GitHub Pagesの表示を目視確認済み
        required: true
        type: boolean
      commit_sha:
        description: 目視確認したGitHub PagesデプロイのコミットSHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sakura-production
  cancel-in-progress: false

jobs:
  build:
    name: Deploy after Pages verification
    if: ${{ inputs.pages_verified }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for commit validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and checkout the verified commit
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character lowercase commit SHA."
            exit 1
          fi

          if ! git cat-file -e "${COMMIT_SHA}^{commit}"; then
            echo "::error::commit_sha does not identify a commit in this repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::commit_sha must be a commit contained in main."
            exit 1
          fi

          git checkout --detach "$COMMIT_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: pnpm build

      - name: Deploy to Sakura server via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          protocol: ftps
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/
          server-dir: ${{ secrets.SERVER_DIR }}
